facial_emotion_training:
  model: "efficientnet_b0"
  num_classes: 8       # Neutral, Happy, Sad, Surprise, Fear, Disgust, Anger, Contempt
  pretrained: true
  freeze_backbone_epochs: 3

  image_size: 224
  face_crop_margin: 0.2

  learning_rate: 0.0001
  weight_decay: 0.0001
  batch_size: 64
  epochs: 30
  patience: 7
  scheduler: "cosine"

  augmentation:
    horizontal_flip: true
    rotation_degrees: 15
    color_jitter: 0.2
    random_erasing: 0.1

  device: "cuda"       # Colab T4
  save_dir: "models/facial_emotion"
  target_accuracy: 0.60
